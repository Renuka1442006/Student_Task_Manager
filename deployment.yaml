apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-task-manager
  labels:
    app: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
      - name: student-app
        image: std_task:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
